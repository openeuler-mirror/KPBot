name: classification-contract
skill: benchmark-wait-variance
tier: A
entrypoint: ["python3", "cases/classification-contract/run.py"]
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: cases/classification-contract/results/result.json
    field: success
    expect: true
  - type: json_field
    file: cases/classification-contract/results/result.json
    field: blocked_wait_status
    expect: confirmed
  - type: json_field
    file: cases/classification-contract/results/result.json
    field: aggregate_clock_status
    expect: blocked
  - type: json_field
    file: cases/classification-contract/results/result.json
    field: cpu_decrease_status
    expect: inconclusive
