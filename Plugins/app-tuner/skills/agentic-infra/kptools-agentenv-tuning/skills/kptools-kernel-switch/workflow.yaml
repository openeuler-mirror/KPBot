  "resources": ["SKILL.md", "references", "scripts", "cases"],
  "steps": ["baseline", "prepare", "stage", "activate", "verify", "handoff"],
  "supervisor": {
    "action": "read",
    "inputs": {"request": "agentenv-kernel-switch-request/v1", "receipt": "agentenv-kernel-switch/v1"},
