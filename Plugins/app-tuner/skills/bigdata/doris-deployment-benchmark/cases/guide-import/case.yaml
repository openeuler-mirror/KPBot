name: guide-import
skill: doris-deployment-benchmark
tier: B
entrypoint: ["bash", "cases/guide-import/run.sh"]
# Host-runtime prerequisites checked by run.sh/preflight.py. Missing items are
# reported as {"status":"env_not_satisfied"} with exit 3, never a skipped pass.
env_requires:
  - Python 3.7+ (standard library ssl, http.server, unittest, importlib)
  - Bash 4+ (associative arrays for the documented COLUMNS map)
  - OpenSSL CLI capable of `req -x509 ... -addext subjectAltName=IP:127.0.0.1`
  - Local loopback TCP bind on 127.0.0.1 (mock TLS FE/BE on ephemeral ports)
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: cases/guide-import/results/result.json
    field: success
    expect: true
