name: contract
skill: kptools-clickhouse-environment-check
tier: A
entrypoint: ["python3", "tests/test_contract.py"]
env_requires: []
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: cases/contract/results/result.json
    field: success
    expect: true
  - type: json_field
    file: cases/contract/results/result.json
    field: requires_live_service
    expect: false
  - type: json_field
    file: cases/contract/results/result.json
    field: tests
    op: gte
    expect: 14
