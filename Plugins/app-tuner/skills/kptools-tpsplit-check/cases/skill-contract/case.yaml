# 用例：tier A —— kptools-tpsplit-check skill 契约用例
#
# 覆盖：
#   --selftest 契约   退出码 0；N/37+ 检查全绿；失败数为 0
#   产物卫生          自测报告写临时目录，不写被跟踪的 examples/（工作区保持干净）
#
# 运行：
#   bash Plugins/app-tuner/skills/kptools-tpsplit-check/cases/skill-contract/run.sh
#   产物 results/result.json；退出码 0 = 全部通过
#   （results/ 已被本目录 .gitignore 覆盖，运行产物不入库）

name: skill-contract
skill: kptools-tpsplit-check
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: checks_ran
    op: gte
    expect: 42
  - type: json_field
    file: results/result.json
    field: failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: examples_clean
    expect: true
