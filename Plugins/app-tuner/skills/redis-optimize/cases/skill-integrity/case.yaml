# 用例：tier A — redis-optimize skill 的完整性契约
#
# 覆盖（checks.py）：
#   1. SKILL.md frontmatter：name 与目录一致、description 非空、长度/字符合法
#   2. SKILL.md / references 中引用的 references/*.md 与 scripts/* 均存在
#   3. 关键安全纪律锚点仍在语料中：
#      ethtool -L 后必须重读 /proc/interrupts、ntuple action 从 0 开始、
#      实例-队列-中断一一对应、虚拟网卡/loopback 门禁、单变量复测、
#      回滚禁止删光 ntuple、NUMA 未知不回落 node 0、RPS/RFS 快照、
#      redis.conf 缺失告警
#   4. evals/evals.json 结构完整（skill_name/id/prompt/expectations 等）
#   5. 敏感内容扫描（私网 IP、凭据字面量、个人 home 路径）
#
# 运行（在 skill 根目录下）：
#   bash cases/skill-integrity/run.sh
#   # 产物 cases/skill-integrity/results/result.json；退出码 0 = 全部通过
#
# 说明：tier A，仅依赖 python3 标准库；不需要真实网卡/Redis 环境。

name: skill-integrity
skill: redis-optimize
tier: A

entrypoint: ["bash", "cases/skill-integrity/run.sh"]

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: links_checked
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: scripts_checked
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: anchors_found
    op: gte
    expect: 10
  - type: json_field
    file: results/result.json
    field: evals_checked
    op: gte
    expect: 3
  - type: json_field
    file: results/result.json
    field: sensitive_findings
    expect: 0
