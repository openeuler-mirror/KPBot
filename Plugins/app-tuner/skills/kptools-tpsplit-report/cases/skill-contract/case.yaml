# 用例：tier A —— kptools-tpsplit-report skill 契约与脚本行为单测
#
# 覆盖：
#   SKILL.md       frontmatter（name 与目录一致、description 含触发词、metadata 完整）
#   资源完整性      scripts/analyze_tpsplit_report.py、scripts/synth_samples.py、
#                  references/stage-glossary.md、evals/evals.json、evals/eval_queries.json
#   内容卫生        无设备厂商/型号词、无工号、无个人绝对路径、LF 行尾
#   脚本契约        evals/run_checks.py 全绿（三场景分类/质量告警/降级/错误路径/
#                  证据链回溯/warmup/确定性/报告结构）
#   自包含         不得引用未随技能交付的脚本；报告三件套（md/html/json）由随包脚本生成
#   注册完整性      仓库内运行时校验 CHANGELOG 条目（独立拷贝时跳过）
#
# 运行：
#   bash Plugins/app-tuner/skills/kptools-tpsplit-report/cases/skill-contract/run.sh
#   产物 results/result.json；退出码 0 = 全部通过

name: skill-contract
skill: kptools-tpsplit-report
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: checks_ran
    op: gte
    expect: 40
  - type: json_field
    file: results/result.json
    field: failures
    expect: 0
