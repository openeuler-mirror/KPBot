# 用例：tier A —— ceph-install skill 契约与安装知识单测
#
# 覆盖：
#   SKILL.md       frontmatter（name 与目录一致、description 触发语、metadata.category=install、
#                  metadata.domain=distributed_storage、license 对齐域内惯例 MulanPSL-2.0）
#   引用完整性     references/installation-guide.md 存在，含 "来源 + 文档版本 07" 标注，
#                  关键内容抽查（Ceph 16.2.7 安装、openEuler-22.03-LTS-SP4 系统镜像源）
#   边界表         SKILL.md 含 ceph-build（已合入）与姊妹 skill ceph-ansible-deployment /
#                  ceph-block-storage-deployment（同批姊妹 PR，同批交付）路由，表格管道平衡；
#                  指南集群扩容按存储类型路由 ceph-block/file/object-expansion（同批 PR #452/#453/#454），
#                  无幻影扩容 skill 名引用
#   安全守卫       TLS 校验保持开启（update-ca-trust）、GPG 公钥不走明文 HTTP 导入并核对指纹、
#                  ISO sha256 摘要核对、local.repo gpgcheck=1、repo 备份保留首次原件（cp -n）、
#                  local.repo 写入前已有文件先 cp -n 备份、回退仅撤销本次安装事务（yum history undo，
#                  按安装前快照恢复）、回退段本地源清理（删除/恢复 local.repo、umount /media）与
#                  末尾 makecache+repolist 核对启用源清单、SKILL.md 输出契约同步上述回退项
#   evals 契约     evals.json（CI-E 前缀、expectations 全中文、禁乱码、禁命令注入模式）、
#                  eval_queries.json（正例/负例矩阵，负例 note 含 routes to）
#
# 运行：
#   bash Plugins/app-tuner/skills/storage/ceph-install/cases/skill-integrity/run.sh
#   # 产物 results/result.json；退出码 0 = 全部通过
#
# 说明：tier A（纯逻辑/静态，python3+bash 标准库，无真机依赖）。

name: skill-integrity
skill: ceph-install
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: static_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: integrity_ran
    expect: 21
  - type: json_field
    file: results/result.json
    field: integrity_failures
    expect: 0
