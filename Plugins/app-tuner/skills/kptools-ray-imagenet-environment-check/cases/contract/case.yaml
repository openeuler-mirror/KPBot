name: ray-imagenet-environment-contract
skill: kptools-ray-imagenet-environment-check
tier: A
# 从本 skill 根目录执行；mock/短命子进程只验证契约，不冒充真实 Ray E2E。
entrypoint:
  - python3
  - scripts/test_contract.py
  - --result
  - results/contract.json
env_requires: []
env_vars: {}
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/contract.json
    field: success
    expect: true
  - type: json_field
    file: results/contract.json
    field: checks_ran
    op: gte
    expect: 10
  - type: json_field
    file: results/contract.json
    field: failures
    expect: 0
  - type: json_field
    file: results/contract.json
    field: errors
    expect: 0
