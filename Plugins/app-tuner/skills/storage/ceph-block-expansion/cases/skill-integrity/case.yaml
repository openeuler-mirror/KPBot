# 用例：tier A —— ceph-block-expansion skill 契约与块存储扩容知识单测
#
# 覆盖：
#   SKILL.md       frontmatter（name 与目录一致、description 触发语、metadata.category=expansion、
#                  metadata.domain=distributed_storage、license 对齐域内惯例 MulanPSL-2.0）
#   引用完整性     references/block-expansion.md 存在，含 "来源 + 文档版本 07" 标注，
#                  关键内容抽查（鲲鹏节点加入 x86 集群、块存储扩容路径、ceph osd df 容量验证）
#   边界表         SKILL.md 含姊妹 skill ceph-block-storage-deployment（同批 PR #446，已合入）、
#                  ceph-file-expansion（同批 PR #453，已合入）/ ceph-object-expansion
#                  （同批 PR #454，已合入）与 ceph-parameter-tuning / ceph-build（已合入）路由，
#                  表格管道平衡
#   单路径守卫     不含文件/对象存储扩容章节标题与两路径专属命令事实（rgw/mds/mount 等），
#                  无私网示例 IP 字面量（仅允许 RFC 5737 文档保留地址）
#   检视闭环守卫   createimage/createimages 定义与调用同名且函数体创建块设备、输出契约与参考
#                  能力一致（OSD/RGW 下线不在范围）、NTP 服务端指向 ceph1 198.51.100.156、
#                  来源标题为 BoostKit 版官方全称
#   二轮闭环守卫   ceph.conf 同步用 config push（无 ceph-deploy admin）、OSD 按核对数据盘
#                  以 by-id 路径逐盘创建（无盘符循环、遇错即停）、防火墙/SELinux 最小化范围
#                  （授权确认 + 恢复项）、PG 官方公式（无 pool_count 除法）、pg_num 不承诺还原、
#                  未合入姊妹带同批 PR 编号标注、免密安全基线
#                  （ed25519/StrictHostKeyChecking=yes + ssh-keyscan/from=）、
#                  扩容基线独立声明与 mon_host 增量式追加
#   三轮闭环守卫   存量节点 rich rule 同时放行新节点 Public 与 Cluster 地址源
#                  （漏 Cluster 段会拦掉 OSD peering/回填）；免密用
#                  StrictHostKeyChecking=yes + ssh-keyscan 预填已知主机，
#                  accept-new 字面量禁入（OpenSSH 7.4p1 不支持，原样执行报
#                  Unsupported option 拒连）
#   evals 契约     evals.json（CBX-E 前缀、expectations 全中文、禁乱码、禁命令注入模式）、
#                  eval_queries.json（正例/负例矩阵，负例 note 含 routes to）
#
# 运行：
#   bash Plugins/app-tuner/skills/storage/ceph-block-expansion/cases/skill-integrity/run.sh
#   # 产物 results/result.json；退出码 0 = 全部通过
#
# 说明：tier A（纯逻辑/静态，python3+bash 标准库，无真机依赖）。

name: skill-integrity
skill: ceph-block-expansion
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: static_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: integrity_ran
    expect: 30
  - type: json_field
    file: results/result.json
    field: integrity_failures
    expect: 0
