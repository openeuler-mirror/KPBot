name: ray-imagenet-benchmark-contract
skill: kptools-ray-imagenet-benchmark
tier: A
# 从本 skill 根目录执行；合成子进程/mock 仅验证契约，真实 Ray E2E 另行执行。
entrypoint:
  - python3
  - scripts/test_contract.py
  - --result
  - results/contract.json
env_requires: []
env_vars: {}
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/contract.json
    field: success
    expect: true
  - type: json_field
    file: results/contract.json
    field: checks_ran
    op: gte
    expect: 12
  - type: json_field
    file: results/contract.json
    field: failures
    expect: 0
  - type: json_field
    file: results/contract.json
    field: errors
    expect: 0
