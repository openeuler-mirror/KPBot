# 用例：tier A —— ceph-build skill 契约与编译知识单测
#
# 覆盖：
#   SKILL.md       frontmatter（name 与目录一致、description 触发语、metadata.category=build、
#                  metadata.domain=distributed_storage、license 对齐域内惯例 MulanPSL-2.0）
#   引用完整性     references/build-guide.md 存在，含 "来源" 标注，
#                  关键内容抽查（openEuler 22.03 编译路径、rpmbuild -ba ceph.spec 编译命令）
#   边界表         SKILL.md 含 ceph-install / ceph-ansible-deployment / ceph-block-storage-deployment /
#                  ceph-parameter-tuning 兄弟路由，表格管道平衡
#   evals 契约     evals.json（CB-E 前缀、expectations 全中文、禁乱码、禁命令注入模式）、
#                  eval_queries.json（正例/负例矩阵，负例 note 含 routes to）
#
# 运行：
#   bash Plugins/app-tuner/skills/storage/ceph-build/cases/skill-integrity/run.sh
#   # 产物 results/result.json；退出码 0 = 全部通过
#
# 说明：tier A（纯逻辑/静态，python3+bash 标准库，无真机依赖）。

name: skill-integrity
skill: ceph-build
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: static_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: integrity_failures
    expect: 0
