# 用例：Redfish 真机实采（evals BC-E02 真机项；无 BMC 时 SKIP）
# 依据 docs/case-spec.md（tier C）。entrypoint 宿主机可直接执行；无环境时按 SKIP 语义 exit 0。

name: redfish-real-bmc
skill: kptools-bios-collector
tier: C
image: host-runtime
entrypoint: ["./entrypoint.sh"]

env_requires:
  - 鲲鹏整机 BMC 可达
  - REDFISH_HOST/REDFISH_USER/REDFISH_PASS（运行时注入）

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: skipped_or_success
    expect: true
