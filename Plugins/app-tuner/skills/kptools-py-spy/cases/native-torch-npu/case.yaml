# 用例：py-spy -n Native 扩展栈专项（torch_npu 环境；无环境时 SKIP）
# 依据 docs/case-spec.md（tier C）。entrypoint 宿主机可直接执行；无环境时按 SKIP 语义 exit 0。

name: native-torch-npu
skill: kptools-py-spy
tier: C
image: host-runtime
entrypoint: ["./entrypoint.sh"]

env_requires:
  - torch_npu 环境
  - Python 带 debug symbols

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: skipped_or_success
    expect: true
