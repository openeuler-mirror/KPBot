# 验证 tier-A 用例：go-protobuf-fixed-slice-bulk-copy 知识卡的完整性契约
#
# 验证内容：
#   skill     SKILL.md 自身格式（frontmatter name 与目录一致、description 存在且 ≤1024 字符）
#   links     SKILL.md 引用的 references/*.md 与 cases/skill-integrity 用例必须在磁盘上存在
#   invariants 方法论不变量仍在语料中（字节探针端序门控 / NativeEndian 比较坑的两种形态 /
#             最低 Go 1.20 与 go.mod 门控 / generate-types 生成模板同步规则 / 畸形载荷回退 /
#             growFloat32Slice 精确预分配 / 目的侧重解释对齐纪律 / NaN payload 位级保持
#             （含 Float64bits）/ errDecode/errUnknown 语义 / 诚实加速比 1.3~3.4 与 12.5x 证据）
#   forbidden 禁止反模式（端序门控的等价形态全兜住）：isLittleEndian = binary.…、
#             isLittleEndian := binary.…、isLittleEndian = (binary.…) 括号形态，
#             以及独立的 NativeEndian/LittleEndian 相等比较，均不得出现
#   numeric   LE wire 语义与尺寸公式的 Python 复算（fixed32 字节序 / float32 位模式 /
#             4n 载荷 + varint 长度公式，公式与参考编码器和 protowire 期望表双重对照 /
#             字节探针语义：经 sys.byteorder 建立主机相关模型，大端主机如实报错而非恒真）
#   negative  七项负向自检（frontmatter 改名 / 锚点缺失 / 禁止反模式三形态注入 /
#             独立 NativeEndian 比较注入 / 探针下标变异，破坏必须全部被捕获）
#   sensitive 敏感内容看护（私网 IP / 凭据 / 个人家目录路径，含 Linux /home 与 macOS
#             /Users；扫描覆盖 SKILL.md、references/*.md 与 cases/ 下全部用例脚本 ——
#             提交前脱敏防线）
#
# 运行（在技能根目录下）：
#   bash cases/skill-integrity/run.sh
#   # 等价：python3 cases/skill-integrity/checks.py
#   # 产出 results/result.json；退出码 0 = 正向全过 + 负向全部被捕获
