# 用例：tier A —— ceph-ansible-deployment skill 契约与部署知识单测
#
# 覆盖：
#   SKILL.md       frontmatter（name 与目录一致、description 触发语、metadata.category=deployment、
#                  metadata.domain=distributed_storage、license 对齐域内惯例 MulanPSL-2.0）
#   引用完整性     references/ansible-deployment.md 与 references/auto-deployment.md 存在，含 "来源 + 文档版本 07" 标注，
#                  关键内容抽查（ceph-ansible、group_vars、ceph_input.xlsx/input_check.sh/install_all.sh）
#   边界表         SKILL.md 含 ceph-parameter-tuning（已合入）与姊妹 skill ceph-block-storage-deployment、
#                  非 ansible 扩容按存储类型路由 ceph-block-expansion / ceph-file-expansion /
#                  ceph-object-expansion（同批姊妹 PR，同批交付）路由，表格管道平衡
#   安全守卫       TLS 校验保持开启（update-ca-trust，git 仅命令级绕过并 log -1 核对版本）、
#                  供应链验签（rpm 一律 https 下载并 rpm -K 签名校验、本地 repo 一律
#                  gpgcheck=1/repo_gpgcheck=1）、业务客户端不下发 client.admin（client.<app>
#                  限权 keyring，ceph auth get -o 导出并 chmod 600、禁 print-key 明文 stdout）、
#                  代理凭据不落 /etc/environment（600 临时 env + 安装后清理）、site.yml hosts
#                  组名缩进 + --syntax-check、CentOS rgw_create_pools 嵌套缩进 + yaml.safe_load
#                  核对、扩容 inventory 统一 hosts、扩容 playbook 目录唯一复数
#                  infrastructure-playbooks/、离线制包用相对路径 zip -r local_source.zip
#                  local_source、解包回显 ls /home/local_source、离线 repo 统一 /home/local_source
#                  与 /etc/yum.repos.d/、ceph_conf_overrides 含 mon_max_pg_per_osd 于 global 下
#   evals 契约     evals.json（CAD-E 前缀、expectations 全中文、禁乱码、禁命令注入模式）、
#                  eval_queries.json（正例/负例矩阵，负例 note 含 routes to）
#
# 运行：
#   bash Plugins/app-tuner/skills/storage/ceph-ansible-deployment/cases/skill-integrity/run.sh
#   # 产物 results/result.json；退出码 0 = 全部通过
#
# 说明：tier A（纯逻辑/静态，python3+bash 标准库，无真机依赖）。

name: skill-integrity
skill: ceph-ansible-deployment
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: static_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: integrity_failures
    expect: 0
