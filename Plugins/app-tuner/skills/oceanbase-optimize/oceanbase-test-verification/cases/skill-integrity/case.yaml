# Tier-A（可执行）契约：oceanbase-test-verification/scripts/smoke_test.sh
#
# 用 PATH 前置的 stub obclient 返回固定 TSV，不依赖真实 OceanBase：
#   1. OB_PORT=70000                       -> exit 2，且不调用任何 obclient
#   2. SPACE_DB 含反引号/空格              -> exit 2，且不调用任何 obclient
#   3. SAMPLE_COL='*'                      -> exit 2，且不调用任何 obclient
#   4. EXPECT_ROWS 不匹配                  -> exit 1，summary failures>=1
#   5. 传入口令后临时 defaults-file        -> 运行结束全部被清理
#   6. EXPECT_WRITABLE 缺业务口令           -> exit 2
#   7. EXPECT_WRITABLE 用业务连接核 read_only（不是 root@sys）；
#      业务租户只读 -> exit 1 且打印 read_only(<biz_user>)=ON，可写 -> exit 0
#
# 运行（在 skill 根目录 oceanbase-test-verification/ 下）：
#   bash cases/skill-integrity/run.sh
#   # 产物 cases/skill-integrity/results/result.json；退出码 0 = 全部通过

name: skill-integrity
skill: oceanbase-test-verification
tier: A

entrypoint: ["bash", "cases/skill-integrity/run.sh"]

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: checks
    op: gte
    expect: 8
