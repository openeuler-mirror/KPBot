name: repeated-measurement-contract
skill: verify-optimization
tier: A
entrypoint: ["python3", "run.py"]

# 从用例目录运行 python3 run.py；也支持安装后的技能目录。
# 标准库逻辑回归；不冒充 agent 端到端或真机测量验证。
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: tests_run
    op: gte
    expect: 10
