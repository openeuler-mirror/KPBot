name: source-only
skill: analyze-prefetch-policy
tier: A
description: 运行仅源码报告校验器的标准库自测，覆盖有效报告和错误证据；不运行 agent、编译器或样例程序。
entrypoint: ["python3", "run.py"]
env_requires: ["Python 3.9+（仅标准库）"]
env_vars: {}

# 从 case 目录执行 python3 run.py。结果固定写入本目录 results/result.json。
# 独立源码分析提示见 prompt.md；报告语义复核见 review-checklist.md。
# success 只表示校验器自测通过，不表示完成了 agent A/B 或语义复核。
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: mode
    expect: verifier-self-test
  - type: json_field
    file: results/result.json
    field: positive_reports
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: negative_reports_rejected_count
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: requires_manual_review
    expect: true
