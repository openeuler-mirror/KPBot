# 用例：tier A —— ceph-file-storage-deployment skill 契约与部署知识单测
#
# 覆盖：
#   SKILL.md       frontmatter（name 与目录一致、description 触发语、metadata.category=deployment、
#                  metadata.domain=distributed_storage、license 对齐域内惯例 MulanPSL-2.0）
#   引用完整性     references/file-storage-deployment.md 存在，含 "来源 + 文档版本 07" 标注，
#                  关键内容抽查（MDS、ceph fs new 元数据池在前、客户机挂载 mount -t ceph）
#   安全守卫       TLS 校验保持开启（update-ca-trust，git 仅命令级绕过）、禁止范围式直清
#                  （逐机核准 /dev/disk/by-id 清单，排除根盘/挂载盘/现役 OSD）、lsblk -f 三 OS
#                  通用口径（偏离标注 util-linux 2.23.2/2.35.2）、业务客户端不下发 client.admin
#                  （client.<cfs-app> 限权 keyring，600 权限落盘，密钥不在命令行打印）、
#                  OSD 普通与 DB/WAL 外置互斥分支、mon_host 与 MON 节点规划逐项核对
#                  （不含 client1 的 .160、补齐 ceph3）、回退小节（fs rm/pool delete/mon
#                  destroy/umount/fstab，删池前临时开启 mon_allow_pool_delete、删除后立即
#                  复位且不预置）、NVMe 两盘注释一致（WAL_NVME/DB_NVME by-id 变量）、
#                  PG 公式官方单池基线口径、acl 用 yum 安装（偏离标注上游 Ubuntu 示例）
#   round-2 守卫   写盘命令块 by-id 变量化（无盘符写盘路径，zap/parted/mklabel/osd create
#                  断言）、危险开关不预置+§6.3 临时开启/立即复位（铁律「用后即复位」）、
#                  建池 pg 1024/128 与公式一致（注明现场重算）、§8.2 ro-status 只读身份
#                  （不对 admin keyring 授持久 ACL，含 ACL 与身份回收）、ceph-deploy 固定
#                  v2.1.0 tag + rev-parse 台账核对 + 隔离 venv 安装（无免校验 github clone）
#   边界表         SKILL.md 含姊妹 skill ceph-object-storage-deployment /
#                  ceph-block-storage-deployment / ceph-ansible-deployment（同批姊妹 PR，同批交付）
#                  路由，表格管道平衡
#   evals 契约     evals.json（CFS-E 前缀、expectations 全中文、禁乱码、禁命令注入模式）、
#                  eval_queries.json（正例/负例矩阵，负例 note 含 routes to）
#
# 运行：
#   bash Plugins/app-tuner/skills/storage/ceph-file-storage-deployment/cases/skill-integrity/run.sh
#   # 产物 results/result.json；退出码 0 = 全部通过
#
# 说明：tier A（纯逻辑/静态，python3+bash 标准库，无真机依赖）。

name: skill-integrity
skill: ceph-file-storage-deployment
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: integrity_ran
    op: gte
    expect: 27
  - type: json_field
    file: results/result.json
    field: static_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: integrity_failures
    expect: 0
