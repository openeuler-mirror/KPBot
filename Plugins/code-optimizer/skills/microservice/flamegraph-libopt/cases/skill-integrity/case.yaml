# 验证 tier-A 用例：flamegraph-libopt 完整性契约
#
# 验证内容：
#   skill     SKILL.md 自身格式（frontmatter name/description 与目录一致）
#   links     SKILL.md 的参考文档链接（本地 references/ 与跨 skill
#             ../<skill>/references/）必须在磁盘上存在且 >=1
#   invariants 方法论不变量仍在语料中（self 口径自检/去嵌套/链接指纹验证/
#             上游 diff 先验/形态前提）
#   sensitive 敏感内容看护（私网 IP / 凭据 / 个人家目录路径）
#
# 解析器功能测试（15 项合成 SVG fixture）已随 parse_flamegraph_svg.py
# 迁至 flamegraph-parsing skill 的 cases/skill-integrity（含两帧布局与
# self=-1 门禁两项新回归），本用例不再覆盖。
#
# 运行（在技能根目录下）：
#   python3 cases/skill-integrity/checks.py
#   # 或完整入口：bash cases/skill-integrity/run.sh
#   # 产出 results/result.json；退出码 0 = 全部通过
#
# 说明：tier-A，仅依赖 python3 标准库；不需要 perf/火焰图环境。

name: skill-integrity
skill: flamegraph-libopt
tier: A

entrypoint: ["bash", "cases/skill-integrity/run.sh"]

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
