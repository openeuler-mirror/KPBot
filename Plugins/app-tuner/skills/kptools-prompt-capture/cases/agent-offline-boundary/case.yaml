name: agent-offline-boundary
skill: kptools-prompt-capture
tier: agent
image: kpbot/prompt-capture-agent:1.0-openeuler24.03
model: opencode/glm-5.3-flash-free
auth: runtime_mount
ab:
  conditions: [with, without]
  metric: success
  uplift: report objective results without performance inference
build:
  context: ../../../..
  dockerfile: skills/kptools-prompt-capture/cases/agent-offline-boundary/Dockerfile
entrypoint: ["bash", "/workspace/entrypoint.sh"]
env_requires:
  - runtime-mounted opencode binary and read-only config/auth directory
  - network access to the selected model API
env_vars:
  MODEL: opencode/glm-5.3-flash-free
  SKILL_MODE: with
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: inputs_unchanged
    expect: true
  - type: json_field
    file: results/result.json
    field: report_correct
    expect: true
