name: classification-contract
skill: benchmark-workload-variance
tier: A
entrypoint: ["python3", "cases/classification-contract/run.py"]
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: cases/classification-contract/results/result.json
    field: success
    expect: true
  - type: json_field
    file: cases/classification-contract/results/result.json
    field: confirmed_status
    expect: confirmed
  - type: json_field
    file: cases/classification-contract/results/result.json
    field: outcome_metric_status
    expect: blocked
  - type: json_field
    file: cases/classification-contract/results/result.json
    field: invalid_mode_rejected
    expect: true
