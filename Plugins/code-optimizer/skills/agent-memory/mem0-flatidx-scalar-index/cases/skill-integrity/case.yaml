# 用例：tier A —— mem0-flatidx-scalar-index 的结构与去私有化完整性看护
#
# 覆盖（checks.py）：
#   1. SKILL.md frontmatter：name 与目录一致、description 非空、无 license:/metadata:
#   2. SKILL.md 中全部 references/*.md 链接可解析（防文档漂移）
#   3. description 携带 适用 / 不适用反例（触发 + 反触发）
#   4. 敏感内容扫描（私网/链路本地 IPv4、私网 IPv6、个人 home 与 root 路径、sshpass、私钥块、
#      键名式凭据（含 JSON/YAML 引号键、ENV 命名空间前缀）、AKIA/sk-/ghp_/github_pat_/glpat-/
#      xoxb-/AIza/hf_/JWT；凭据命中只回显键名与长度）
#   4b. 扫描规则自检：正样本必须命中、负样本不得命中、凭据回显必须脱敏
#      （结果写入 result.json 的 sensitive_selftest_* 字段，case.yaml 逐项断言）
#   5. SKILL.md 中全部 scripts/*.py 引用可解析（防脚本漂移）
#
# 运行：bash skills/agent-memory/mem0-flatidx-scalar-index/cases/skill-integrity/run.sh
# 产物 results/result.json；退出码 0 = 全部通过

name: skill-integrity
skill: mem0-flatidx-scalar-index
tier: A

entrypoint: ["bash", "cases/skill-integrity/run.sh"]

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: links_checked
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: sensitive_findings
    expect: 0
  - type: json_field
    file: results/result.json
    field: sensitive_selftest_positive_total
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: sensitive_selftest_positive_missed
    expect: 0
  - type: json_field
    file: results/result.json
    field: sensitive_selftest_negative_flagged
    expect: 0
  - type: json_field
    file: results/result.json
    field: sensitive_selftest_redaction_ok
    expect: true
