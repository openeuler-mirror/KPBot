# 验证 tier-A 用例：perf-optimization-report 知识卡的完整性契约
#
# 验证内容：
#   skill     SKILL.md 自身格式（frontmatter name/description 与目录一致）
#   links     SKILL.md 引用的 references/*.md 与 scripts/fold_traces.py 必须存在
#   invariants 方法论不变量仍在语料中（五章骨架/证据清单/权威口径优先/废协议
#             披露/成本模型+争用放大/故障注入/仓内相对路径/-traces 折叠源/
#             Total samples 权重门/experiment_summary 实验总账）
#   sensitive 敏感内容看护（私网 IP / 凭据 / 个人家目录路径 / Windows 盘符路径）
#   functional fold_traces.py 功能契约（真实格式夹具：栈逆序/单位归一/inline
#             剥离/块合并/精确产物）+ 三条失败路径（用法错误 exit 2 / 拒绝覆盖
#             exit 2 / 空解析 exit 1 不静默成功）
#
# 运行（在技能根目录下）：
#   python3 cases/skill-integrity/checks.py
#   # 或完整入口：bash cases/skill-integrity/run.sh
#   # 产出 results/result.json；退出码 0 = 全部通过
#
# 说明：tier-A，仅依赖 python3 标准库；不需要 Go 环境（夹具是 -traces 文本）。

name: skill-integrity
skill: perf-optimization-report
tier: A

entrypoint: ["bash", "cases/skill-integrity/run.sh"]

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: pass
    expect: true
  - type: json_field
    file: results/result.json
    field: checks
    expect: 21
