# 用例：vLLM 方案一全链（evals AP-E01/E03 真机项；无环境时 SKIP）
# 依据 docs/case-spec.md（tier C）。evals ID 映射见各断言注释；entrypoint 宿主机可直接执行。

name: vllm-real-910b
skill: kptools-ascend-profiling
tier: C
image: host-runtime
entrypoint: ["./entrypoint.sh"]

env_requires:
  - 910B NPU
  - CANN + torch_npu
  - vLLM 服务（--profiler-config 注入）
  - 部署约束：服务端 torch_profiler_dir 须指向用例可见路径（PROF_OUTPUT_DIR），pt-start 的 -o 仅作本地记录（见 ascend-profiling collect.sh pt-start 说明）
env_vars:
  VLLM_URL: http://127.0.0.1:8000
  PROF_OUTPUT_DIR: ""

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: skipped_or_success
    expect: true
