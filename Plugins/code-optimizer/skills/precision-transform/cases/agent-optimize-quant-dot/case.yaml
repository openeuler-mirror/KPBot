# 用例：agent 级端到端 —— 容器内用 opencode 调用 precision-transform
# 消除量化点积中的逐元素 widen 转换（整数域累加 + 单点 widen）
#
# 构建：
#   docker build --network host -f skills/precision-transform/cases/agent-optimize-quant-dot/Dockerfile \
#       -t kpbot/code-optimizer-agent-quant-dot:1.0-openeuler24.03 .
#   ./run_ab.sh --save results-ab

name: agent-optimize-quant-dot
skill: precision-transform
tier: agent

image: kpbot/code-optimizer-agent-quant-dot:1.0-openeuler24.03
model: deepseek/deepseek-v4-flash
auth: env_injection

ab:
  conditions: [with, without]
  skill_enabled:
    with: true
    without: false
  metric: speedup
  uplift: speedup_with / speedup_without

build:
  context: ../../../..
  dockerfile: skills/precision-transform/cases/agent-optimize-quant-dot/Dockerfile

entrypoint: ["/workspace/entrypoint.sh"]

env_requires:
  - aarch64 主机（NEON 可用）
  - opencode 二进制（运行时只读挂载，路径白名单校验）
  - OPENCODE_AUTH_JSON（auth.json 整文件 base64 经环境变量注入）
  - 容器可访问 deepseek API（模型 API 由运行环境代为调用，agent 无网络权限）

env_vars:
  MODEL: deepseek/deepseek-v4-flash
  SKILL_MODE: with
  N: 4000000
  ITERS: 20

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: optimized_correct
    expect: 1
  - type: json_field
    file: results/result.json
    field: rel_err
    op: lte
    expect: 0.001
  - type: json_field
    file: results/result.json
    field: speedup
    op: gte
    expect: 1.0
