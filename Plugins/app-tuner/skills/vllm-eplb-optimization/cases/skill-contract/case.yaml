# 用例：tier A —— vllm-eplb-optimization skill 契约与脚本行为单测
#
# 覆盖：
#   SKILL.md       frontmatter（name 与目录一致、description 含触发词、metadata 完整）
#   资源完整性      scripts/apply_eplb.py、scripts/gen_imbalanced_dataset.py、references/
#                  evals/evals.json、evals/eval_queries.json
#   内容卫生        无设备厂商/型号词、无工号、无个人绝对路径、LF 行尾
#   脚本契约        evals/run_checks.py 全绿（模式切换/幂等/dry-run 不落盘/守卫/数据集）
#   注册完整性      仓库内运行时校验 CHANGELOG 条目（独立拷贝时跳过）
#
# 运行：
#   bash Plugins/app-tuner/skills/vllm-eplb-optimization/cases/skill-contract/run.sh
#   产物 results/result.json；退出码 0 = 全部通过

name: skill-contract
skill: vllm-eplb-optimization
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: checks_ran
    op: gte
    expect: 30
  - type: json_field
    file: results/result.json
    field: failures
    expect: 0
