# 用例：tier A — pgvector-deploy skill 的完整性契约
#
# 覆盖（checks.py）：
#   1. SKILL.md frontmatter：name 与目录一致、description 非空、无 XML 标签
#   2. SKILL.md / references 中引用的 references/*.md、scripts/*、assets/* 均存在
#   3. 默认版本固定 master，构建根固定 /var/cache/pgvector-deploy；
#      安装脚本保留路径归一化、mktemp、源码目录校验、PGPASSWORD、
#      CREATE/ALTER EXTENSION 等安全与功能标记
#   4. 关键锚点仍在语料中：
#      默认 master、pg_config、CREATE EXTENSION、deploy.env、超级用户、
#      构建目录 0700、离线 --source-dir、PGPASSWORD、最近邻验证、
#      远程数据库主机限制、危险操作警告、路径 .. 拒绝
#   5. evals/evals.json 结构完整且至少 5 条用例
#   6. 敏感内容扫描（私网 IP、凭据字面量、个人 home 路径）
#
# 运行（在 skill 根目录下）：
#   bash cases/skill-integrity/run.sh
#   # 产物 cases/skill-integrity/results/result.json；退出码 0 = 全部通过
#
# 说明：tier A，仅依赖 python3 标准库；不需要真实 PostgreSQL/pgvector 环境。

name: skill-integrity
skill: pgvector-deploy
tier: A

entrypoint: ["bash", "cases/skill-integrity/run.sh"]

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: links_checked
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: scripts_checked
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: assets_checked
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: anchors_found
    op: gte
    expect: 10
  - type: json_field
    file: results/result.json
    field: evals_checked
    op: gte
    expect: 5
  - type: json_field
    file: results/result.json
    field: sensitive_findings
    expect: 0
