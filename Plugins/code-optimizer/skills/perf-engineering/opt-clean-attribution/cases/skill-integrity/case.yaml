# 用例：tier A —— perf-engineering/opt-clean-attribution 的结构与去私有化完整性看护
#
# 覆盖（checks.py）：
#   1. SKILL.md frontmatter：name 与目录一致、description 非空、无 license:/metadata:
#   2. SKILL.md 中全部 references/*.md 链接可解析（防文档漂移）
#   3. description 携带 适用 / 不适用反例（触发 + 反触发）
#   4. 敏感内容扫描（私网 IP、凭据字面量、个人 home 路径、sshpass、api_key/token/secret/AKIA/sk-）
#   5. SKILL.md 中全部 scripts/*.py 引用可解析（防脚本漂移）
#
# 运行：bash skills/perf-engineering/opt-clean-attribution/cases/skill-integrity/run.sh
# 产物 results/result.json；退出码 0 = 全部通过

name: skill-integrity
skill: opt-clean-attribution
tier: A

entrypoint: ["bash", "cases/skill-integrity/run.sh"]

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: links_checked
    op: gte
    expect: 1
  - type: json_field
    file: results/result.json
    field: sensitive_findings
    expect: 0
