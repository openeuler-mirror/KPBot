# llvm-mca-visualize 成功路径：用 assets/examples/loop.s 生成默认 iter5 HTML 与 JSON 契约
#
# 运行（在 skill 根目录）：
#   MCA_BIN=/path/to/patched/llvm-mca bash cases/visualize-saxpy-loop/run.sh
#   # 可选 UARCH=hip11 显式指定微架构（缺省从 /proc/cpuinfo 自动检测）
# 断言结果写入 cases/visualize-saxpy-loop/results/result.json，退出码 0 = 全部通过。
#
# 前置：aarch64 主机；patched llvm-mca（支持 -issue-trace）；python3。

name: visualize-saxpy-loop
skill: llvm-mca-visualize
tier: A
image: host-runtime

entrypoint: ["bash", "cases/visualize-saxpy-loop/run.sh"]

env_requires:
  - aarch64 Linux（含 HiSilicon hip08/hip11/hip12 调度模型的 LLVM）
  - patched llvm-mca（支持 -issue-trace），路径由 MCA_BIN 指定
  - python3（标准库）

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: checks_failures
    expect: 0
