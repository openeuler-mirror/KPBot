# 用例：V8 日志解析 + cpuprofile 定位（evals NP-E01/E02/E03）
# 依据 docs/case-spec.md（tier B）。evals ID 映射见各断言注释；entrypoint 宿主机可直接执行。

name: parse-v8-profile
skill: kptools-node-profiler
tier: B
image: host-runtime
entrypoint: ["./entrypoint.sh"]

env_requires: []
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: parse_hotA_visible
    expect: true
  - type: json_field
    file: results/result.json
    field: cpuprofile_located
    expect: true
