# 用例：agent 级端到端 —— 执行一次 nginx 调优循环（mock 压测）
#
# 说明：tier agent。使用 mock 压测工具（确定性指标，零副作用），验证 agent 是否严格
# 遵循 "baseline → 只改一个参数 → 复测 → before/after → 保留/回退" 的循环纪律。
# with-skill 在容器内接入 nginx-baseline-setup（仅 SKILL.md + references/）；
# without-skill 不接入任何 skill，任务完全相同。
#
# 构建/运行（在 KPBot 插件根目录，需容器可访问模型 API）：
#   docker build \
#     -f skills/microservice/nginx/nginx-baseline-setup/cases/agent-tuning-loop/Dockerfile \
#     -t kpbot/app-tuner-agent-nginx-baseline-tuning-loop:1.0-openeuler24.03 .
#   bash skills/microservice/nginx/nginx-baseline-setup/cases/run_all.sh

name: agent-tuning-loop
skill: nginx-baseline-setup
tier: agent

image: kpbot/app-tuner-agent-nginx-baseline-tuning-loop:1.0-openeuler24.03
model: deepseek/deepseek-v4-flash
auth: env_injection          # auth.json 整文件 base64 经 OPENCODE_AUTH_JSON env 注入，不挂载

ab:
  conditions: [with, without]
  skill_enabled:
    with: true
    without: false
  metric: assertion_pass_rate
  uplift: pass_rate_with - pass_rate_without   # 差值（百分点），与 run_ab.sh 的 uplift 口径一致

build:
  context: ../../../../../..
  dockerfile: skills/microservice/nginx/nginx-baseline-setup/cases/agent-tuning-loop/Dockerfile

entrypoint: ["/workspace/entrypoint.sh"]

env_requires:
  - opencode 二进制（运行时只读挂载，宿主路径需通过白名单校验）
  - opencode auth.json（整文件 base64 经 OPENCODE_AUTH_JSON env 注入，不挂载）
  - 容器可访问模型 API（默认 bridge；确需 host 时显式 DOCKER_RUN_ARGS=--network=host）

env_vars:
  MODEL: deepseek/deepseek-v4-flash
  SKILL_MODE: with
  MOCK_LOG: /workspace/work/mock_invocations.jsonl

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: one_variable
    expect: true
  - type: json_field
    file: results/result.json
    field: skills_invoked
    op: contains
    value: nginx-baseline-setup
