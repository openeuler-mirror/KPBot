# 用例:tier A —— vector-db-optimization-migration 的门禁脚本契约
#
# 覆盖(全部来自 MR 评审反例):
#   compare_topk  G0/G3 等价性门禁:顺序交换、ULP 级距离漂移、候选侧多余/
#                 缺失查询、条数不一致默认必须退出 1;--allow-order-change
#                 与显式 --atol/--rtol 是仅有的放宽;输出字段使用 overlap@k
#                 命名,不冒充对 ground truth 的 recall。
#   check_flags   compile_commands.json 解析:-U 取消先前的 -D、-U 后 -D
#                 以后者为准、空格分隔 "-march value" 折叠识别、缺失
#                 uniform flag 的 TU 记为 <absent> 并默认判非一致失败、
#                 --allow-inconsistent 降级为仅报告。
#   scan_delta    版本差异审计:CMake option() 缺省默认按隐式 OFF 处理
#                 (不再误报"新增"),组合条件 #if defined(A) && defined(B)
#                 中的每个宏都会被捕获。
#   skill         SKILL.md frontmatter 完整、引用的 references/scripts/
#                 templates 资产存在、known-cases 可追溯标注与噪声标定
#                 修订在位。
#
# 运行(在技能根目录下):
#   bash cases/script-contract/run.sh
#   # 产物 results/result.json;退出码 0 = 全部通过

name: script-contract
skill: vector-db-optimization-migration
tier: A

entrypoint: ["bash", "cases/script-contract/run.sh"]

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: checks_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: checks_ran
    op: gte
    expect: 40
