# Tier A: fake systemctl/curl/official quickcheck; no real host verification.
# Run from any directory: bash cases/verify-contract/run.sh
name: verify-contract
skill: cubesandbox-deployment-verify
tier: A
assert:
  - {type: exit_code, expect: 0}
  - {type: json_field, file: results/result.json, field: success, expect: true}
  - {type: json_field, file: results/result.json, field: verify_success, expect: true}
  - {type: json_field, file: results/result.json, field: health_failure_detected, expect: true}
  - {type: json_field, file: results/result.json, field: missing_quickcheck_blocked, expect: true}
  - {type: json_field, file: results/result.json, field: incomplete_evidence_blocked, expect: true}
  - {type: json_field, file: results/result.json, field: directory_guard, expect: true}
  - {type: json_field, file: results/result.json, field: missing_shared_blocked, expect: true}
  - {type: json_field, file: results/result.json, field: report_path_safe, expect: true}
  - {type: json_field, file: results/result.json, field: read_only, expect: true}
  - {type: json_field, file: results/result.json, field: secret_safe, expect: true}
