# 用例：kptools-jvmjit 容器内 JIT 符号化采集（对应 evals JJ-E01 符号缺失 / JJ-E02 容器场景核心能力）
# 依据 docs/case-spec.md（tier C，host-runtime：真机 perf/容器/javac 镜像为声明式前置，环境不具备时按 SKIP 语义 exit 0，
# 对齐 kptools-py-spy native-torch-npu 的 skipped_or_success 约定）。
# 前置（env_requires）：宿主机 perf(支持 --jit) + libperf-jvmti.so + JDK(javac) + docker +
# 本地任一含 javac 的镜像（可用 JVMJIT_TEST_IMAGE 指定，默认自动探测）。

name: batch-analysis
skill: kptools-jvmjit
tier: C
image: host-runtime
entrypoint: ["./entrypoint.sh"]

env_requires:
  - 宿主机 perf（支持 --jit）+ libperf-jvmti.so（openEuler: /usr/lib64）
  - 宿主机 JDK 11+（javac 编译被测类）
  - docker + 本地含 javac 的镜像（JVMJIT_TEST_IMAGE 或自动探测；容器将加 SYS_ADMIN 重建）

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: skipped_or_success
    expect: true
