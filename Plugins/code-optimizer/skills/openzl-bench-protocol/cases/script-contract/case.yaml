# 用例：tier A —— openzl-bench-protocol 三个脚本的契约与核心逻辑单测
#
# 覆盖：
#   prepare_kvdata.py  dtype 探测 / 位布局 / 熵计算 / CLI 契约（torch stub）
#                      + 数值回归（分块 bincount vs Counter 参考实现，
#                      含跨块边界，numpy 缺失时自动跳过）
#                      + P2 回归看护（禁止 .tolist()/Counter 物化全量 Python 对象）
#   bench_kv.sh        mock unitBench 输出解析（MB/s / outbytes / R）、
#                      缺数据与未注册场景的跳过行为、退出码
#   td_loop.sh         参数契约、compress/decompress 吞吐与压缩比解析、rounds 模式
#
# 运行：
#   bash skills/openzl-bench-protocol/cases/script-contract/run.sh
#   # 产物 results/result.json；退出码 0 = 全部通过
#
# 说明：tier A（纯逻辑/mock，python3+bash 标准库；numpy 为可选增强）。
#       agent 层用例（opencode 驱动真实 unitBench 数据准备与基准）待后续迭代。

name: script-contract
skill: openzl-bench-protocol
tier: A

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: prepare_kvdata_ran
    op: gte
    expect: 8
  - type: json_field
    file: results/result.json
    field: prepare_kvdata_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: bench_kv_ran
    op: gte
    expect: 4
  - type: json_field
    file: results/result.json
    field: bench_kv_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: td_loop_ran
    op: gte
    expect: 6
  - type: json_field
    file: results/result.json
    field: td_loop_failures
    expect: 0
  - type: json_field
    file: results/result.json
    field: static_failures
    expect: 0
