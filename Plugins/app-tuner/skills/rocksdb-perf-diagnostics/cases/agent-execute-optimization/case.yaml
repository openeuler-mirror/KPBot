# 用例：agent 级端到端 —— 真正执行一次 RocksDB 调优循环
#
# 说明：tier agent。使用 mock 基准（确定性指标，不依赖真实 RocksDB），验证 agent 是否
# 严格遵循 "baseline → 只改一个参数 → 复测 → before/after → 保留/回退" 的循环。
# with-skill 在容器内接入 rocksdb-perf-diagnostics，prompt 显式要求调用；
# without-skill 不接入任何 skill，任务完全相同。
#
# 构建/运行（在 KPBot 插件根目录，需容器可访问模型 API）：
#   docker build --network host \
#     -f skills/rocksdb-perf-diagnostics/cases/agent-execute-optimization/Dockerfile \
#     -t kpbot/app-tuner-agent-execute-optimization:1.0-openeuler24.03 .
#   ./run_ab.sh --save results-ab

name: agent-execute-optimization
skill: rocksdb-perf-diagnostics
tier: agent

image: kpbot/app-tuner-agent-execute-optimization:1.0-openeuler24.03
model: deepseek/deepseek-v4-flash
auth: runtime_mount

ab:
  conditions: [with, without]
  skill_enabled:
    with: true
    without: false
  metric: assertion_pass_rate
  uplift: pass_rate_with / pass_rate_without

build:
  context: ../../../..
  dockerfile: skills/rocksdb-perf-diagnostics/cases/agent-execute-optimization/Dockerfile

entrypoint: ["/workspace/entrypoint.sh"]

env_requires:
  - opencode / cannbot 二进制（运行时挂载，白名单校验）
  - 凭证经 OPENCODE_AUTH_JSON base64 env 注入（不挂载 auth.json）
  - provider 配置由宿主导出 MODEL / ANTHROPIC_*（额外变量用 OPENCODE_EXTRA_ENV）
  - 容器默认 bridge 网络（不支持 --network=host）

env_vars:
  MODEL: deepseek/deepseek-v4-flash
  SKILL_MODE: with
  MOCK_LOG: /workspace/results/mock_invocations.log

assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: one_variable
    expect: true
