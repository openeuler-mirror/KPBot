name: handoff-contract
skill: kptools-vllm-ttft-collect
tier: A
entrypoint: ["python3", "run.py"]

# 从用例目录运行，要求安装同级 kptools-vllm-ttft（KPBot !181）。
# 使用本地日志夹具验证交接，不发送实时请求。
assert:
  - type: exit_code
    expect: 0
  - type: json_field
    file: results/result.json
    field: success
    expect: true
  - type: json_field
    file: results/result.json
    field: tests_run
    op: gte
    expect: 5
  - type: json_field
    file: results/result.json
    field: skipped
    expect: 0
